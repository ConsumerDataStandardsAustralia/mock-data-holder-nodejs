
name: panva
services:
  panva-oidc:
    container_name: panva-oidc
    image: consumerdatastandardsaustralia/panva-oidc:0.2
    restart: unless-stopped
    env_file: .env.panva
    extra_hosts:
      - host.docker.internal:host-gateway
      - nodejs-data-holder:host-gateway
    networks:
      - dsb
    ports:
      - 3001:3000
    depends_on:
      - mongodb

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: unless-stopped
    volumes:     
      - dbdata:/usr/local/var/mongodb
    ports:
      - "27017:27017"
    networks:
      - dsb     
  
  nodejs-data-holder:
    container_name: nodejs-data-holder
    image: consumerdatastandardsaustralia/nodejs-data-holder:0.5
    build:
      context: . 
      dockerfile: dockerfile.dsb-test-data-server       
    restart: unless-stopped
    env_file: .env.dh
    extra_hosts:
      - host.docker.internal:host-gateway
      - panva-oidc:host-gateway 
    ports:
       - "3005:3005"
    networks:
       - dsb
    depends_on:
      - mongodb
      - panva-oidc

  dsb-data-loader:
    container_name: dsb-data-loader
    image: consumerdatastandardsaustralia/dsb-data-loader:0.3
    build:
      context: .
      dockerfile: dockerfile.dsb-data-loader    
    env_file: .env.loader
    depends_on:
      - mongodb
    networks:
       - dsb

volumes:
  dbdata:

networks:
  dsb:
  

